name: Frontend quality checks
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Run smoke tests
        run: node --test tests/*.test.js
