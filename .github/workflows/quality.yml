name: Frontend and Worker quality checks
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check frontend JavaScript syntax
        run: node --check app.js
      - name: Run frontend smoke tests
        run: node --test tests/*.test.js
      - name: Install Worker dependencies
        run: npm --prefix worker install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Check Worker JavaScript syntax
        run: npm --prefix worker run check
      - name: Run Worker security and HTTP-boundary tests
        run: npm --prefix worker test
