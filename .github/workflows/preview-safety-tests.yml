name: SUKUMA preview safety tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'tests/preview-safety.test.cjs'
      - '.github/workflows/preview-safety-tests.yml'
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'tests/preview-safety.test.cjs'
      - '.github/workflows/preview-safety-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run preview safety tests
        run: node --test tests/preview-safety.test.cjs
